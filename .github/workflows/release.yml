name: Release Candidate

# 推 v* tag 或手动触发时构建并校验签名包,产出 artifact 与摘要。
# 公开发布是独立动作:见 publish.yml,需 environment 批准 + 精确 SHA-256。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 候选版本标签（如 v0.1.3），需与推送代码内容一致
        type: string
        required: true

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: 构建候选包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 递增门以已公开版本为基准:取所有 Release tag 里最大的 versionCode
      - name: 读取已公开版本
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | python3 scripts/verify_release_apk.py --list-published)
          echo "code=$PUBLISHED" >> "$GITHUB_OUTPUT"

      # 版本号只认 tag:versionName 去 v,versionCode 为 major*10000+minor*100+patch
      - name: 解析版本
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISHED: ${{ steps.published.outputs.code }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! VERSION_CODE=$(python3 scripts/verify_release_apk.py "$TAG" \
                 --published-version-code "$PUBLISHED"); then
            echo "::error::版本标签不合法:$TAG"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # tools 已从 SDK 仓库下架,packages 必须显式列出
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.1 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties 里固定的是本机 Android Studio JBR 路径,runner 上不存在
      - name: 使用 runner 的 JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名相关的 secret"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASSWORD \
                 -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::RELEASE_STORE_PASSWORD 无法解锁 keystore"
            exit 1
          fi

      # 模型归档约 460MB,按归档 SHA 缓存,避免每次发版都重新下载
      - name: 缓存模型下载
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: sensevoice-archive-7d1efa2138a65b0b

      - name: 获取模型资产
        run: bash scripts/fetch_model.sh

      - name: 构建 Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew testDebugUnitTest lintRelease assembleRelease --console=plain \
            -PsonletVersionName="$VERSION" -PsonletVersionCode="$VERSION_CODE"

      - name: 校验 APK
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/verify_release_apk.py "$TAG" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: 打印签名信息
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: 打包候选件
        id: artifact
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="Sonlet-$VERSION-arm64-v8a.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$ASSET"
          SHA=$(sha256sum "dist/$ASSET" | awk '{print $1}')
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: 上传候选包
        uses: actions/upload-artifact@v7
        with:
          name: sonlet-release-apk
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: 汇总
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ASSET: ${{ steps.artifact.outputs.asset }}
          SHA: ${{ steps.artifact.outputs.sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "### 候选包 $TAG"
            echo ""
            echo "- versionCode: \`$VERSION_CODE\`"
            echo "- 资产: \`$ASSET\`"
            echo "- SHA-256: \`$SHA\`"
            echo "- run_id: \`$RUN_ID\`"
            echo ""
            echo "公开发布请执行 Publish 工作流,传入上面的 tag、run_id、SHA-256;"
            echo "该工作流需要 release environment 批准。"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/*.apk >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: 清理签名参数
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
