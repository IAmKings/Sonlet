name: Release

# 推 v* tag 时自动构建签名包并发布 GitHub Release;
# workflow_dispatch 用于演练:默认只构建校验,不创建 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 演练使用的版本标签（如 v0.1.2），需与推送代码内容一致
        type: string
        required: true
      dry_run:
        description: 只构建与校验，不创建 Release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布签名 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号只认 tag:versionName 去 v,versionCode 为 major*10000+minor*100+patch
      - name: 解析版本
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! VERSION_CODE=$(python3 scripts/verify_release_apk.py "$TAG"); then
            echo "::error::版本标签不合法:$TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # tools 已从 SDK 仓库下架,packages 必须显式列出
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties 里固定的是本机 Android Studio JBR 路径,runner 上不存在
      - name: 使用 runner 的 JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名相关的 secret"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASSWORD \
                 -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::RELEASE_STORE_PASSWORD 无法解锁 keystore"
            exit 1
          fi

      # 模型归档约 460MB,按归档 SHA 缓存,避免每次发版都重新下载
      - name: 缓存模型下载
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: sensevoice-archive-7d1efa2138a65b0b

      - name: 获取模型资产
        run: bash scripts/fetch_model.sh

      - name: 构建 Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew testDebugUnitTest lintRelease assembleRelease --console=plain \
            -PsonletVersionName="$VERSION" -PsonletVersionCode="$VERSION_CODE"

      - name: 校验 APK
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/verify_release_apk.py "$TAG" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: 打印签名信息
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: 发布 Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="$RUNNER_TEMP/Sonlet-$VERSION-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 同名 tag 已存在 Release:补传或覆盖资产,不再重复创建
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Sonlet $VERSION" \
              --generate-notes \
              --verify-tag
          fi

      - name: 汇总
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### $TAG" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/release/app-release.apk >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: 清理签名参数
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
