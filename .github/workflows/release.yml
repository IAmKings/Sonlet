name: Release

# 打 tag(v1.2.3)即发布:构建签名 APK → 校验资产完整性 → 上传到 GitHub Release。
# workflow_dispatch 用于演练:默认 dry_run,只构建不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建、不创建 Release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # tools 已从 SDK 仓库下架,packages 必须显式列出
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties 里固定的是本机 Android Studio JBR 路径,runner 上不存在
      - name: 使用 runner 的 JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名相关的 secret,无法发布"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASSWORD \
                 -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::RELEASE_STORE_PASSWORD 无法解锁 keystore(口令长度 ${#STORE_PASSWORD})"
            exit 1
          fi

      # 模型归档约 460MB,按归档 SHA 缓存,避免每次发版都重新下载
      - name: 缓存模型下载
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: sensevoice-archive-7d1efa2138a65b0b

      - name: 获取模型资产
        run: bash scripts/fetch_model.sh

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              v[0-9]*) ;;
              *) echo "::error::tag 必须形如 v1.2.3,当前为 $TAG"; exit 1 ;;
            esac
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dispatch"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # 非数字时按 0 处理,避免 set -u 下空值报错
          MAJOR=$(( 10#${MAJOR%%[!0-9]*} ))
          MINOR=$(( 10#${MINOR%%[!0-9]*} ))
          PATCH=$(( 10#${PATCH%%[!0-9]*} ))
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          # AGP 要求 versionCode 为正整数,演练版(v0.0.0)与 0.x 首版都可能算出 0
          if [ "$VERSION_CODE" -lt 1 ]; then VERSION_CODE=1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION(versionCode $VERSION_CODE)"

      - name: 构建 Release
        run: |
          ./gradlew assembleRelease --console=plain \
            -PsonletVersionName="${{ steps.version.outputs.version }}" \
            -PsonletVersionCode="${{ steps.version.outputs.version_code }}"

      # 历史上 CI 产物只有 29MB,原因是模型不在仓库里也没拉取;这一步确保不会再发出这种包
      - name: 校验 APK 完整性
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -q "assets/sensevoice/model.int8.onnx" \
            || { echo "::error::APK 缺少模型资产,拒绝发布"; exit 1; }
          unzip -l "$APK" | grep -q "assets/sensevoice/tokens.txt" \
            || { echo "::error::APK 缺少 tokens.txt,拒绝发布"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 200000000 ]; then
            echo "::error::APK 仅 $((SIZE / 1000000))MB,低于 200MB,疑似缺少模型"
            exit 1
          fi

      - name: 校验签名
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: 发布 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          OUT="Sonlet-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp "$APK" "$OUT"
          gh release create "${GITHUB_REF_NAME}" "$OUT" \
            --title "Sonlet ${{ steps.version.outputs.version }}" \
            --notes "端侧离线语音听写,仅 arm64-v8a。模型已内置,首次启动无需联网。" \
            --generate-notes

      - name: 演练产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-dryrun
          path: app/build/outputs/apk/release/app-release.apk

      - name: 清理签名参数
        if: always()
        run: rm -f keystore.properties
