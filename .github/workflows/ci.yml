name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 该 action 的 packages 默认含 tools,而 tools 已从 SDK 仓库下架,会导致安装失败
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties 为本地开发固定了 Android Studio 的 JBR 绝对路径,
      # 该路径在 runner 上不存在。删掉这一行让 Gradle 用 setup-java 装好的 JDK。
      - name: 使用 runner 的 JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

  dependency-submission:
    name: 依赖图谱上报
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 该 action 的 packages 默认含 tools,而 tools 已从 SDK 仓库下架,会导致安装失败
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35

      - uses: gradle/actions/setup-gradle@v6

      - name: 使用 runner 的 JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      # 把解析出的依赖提交到 GitHub 依赖图谱,仓库的 Dependabot 告警据此工作
      - uses: gradle/actions/dependency-submission@v6

  dependency-review:
    name: 依赖安全审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # 只审查本次 PR 新增/升级的依赖,高危及以上直接阻断合并
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  release:
    name: 签名 Release 包
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 该 action 的 packages 默认含 tools,而 tools 已从 SDK 仓库下架,会导致安装失败
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35

      - uses: gradle/actions/setup-gradle@v6

      - name: 使用 runner 的 JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      # 密钥材料只经环境变量进入 runner,不写进 workflow 文本;keystore.properties 用完即删
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少 RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD 之一,无法签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          # 打印还原出的 keystore 指纹,便于与本地 shasum -a 256 release.jks 对照
          echo "keystore sha256: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)"

      # 先用 keytool 单独验一次口令,失败时给出可操作的提示,而不是埋在半页 Gradle 堆栈里
      - name: 检查密钥口令
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASSWORD \
               -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "storePassword 可解锁 keystore"
          else
            echo "::error::RELEASE_STORE_PASSWORD 无法解锁 keystore:口令与 release.jks 不匹配(常见原因是粘贴时带入尾随空格,或密钥重建后未更新 secret);当前口令长度 ${#STORE_PASSWORD}"
            exit 1
          fi
          if [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "::warning::PKCS12 的 keyPassword 必须与 storePassword 相同,当前两者不一致"
          fi

      - name: 构建 Release
        run: ./gradlew assembleRelease --stacktrace

      - name: 校验签名
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: 清理签名参数
        if: always()
        run: rm -f keystore.properties
